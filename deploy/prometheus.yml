global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: hotel
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitoring_key
    static_configs:
      - targets: [hotel:8080]
    # Private HTTP telemetry is protected by the scrape key; business APIs still require HTTPS.
