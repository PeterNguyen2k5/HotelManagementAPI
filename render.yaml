# Blueprint for a new Docker Web Service. Persistent disks require paid compute.
services:
  - type: web
    name: hotelmanagementapi-blueprint
    runtime: docker
    branch: main
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    disk:
      name: hotel-data
      mountPath: /var/lib/hotel
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: BootstrapAdmin__Password
        sync: false
